openapi: 3.0.3
info:
  title: Planet2Planet API
  version: 0.1.0
  description: Subspace plan comparison for the Sol system, 2380. Fan work.
paths:
  /api/canon/facts/:
    get:
      operationId: canon_facts_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - deadline
          - set-aside
          - starting-condition
      tags:
      - canon
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanonFact'
          description: ''
  /api/companies/:
    get:
      operationId: companies_list
      parameters:
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: sector
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: world
        schema:
          type: string
      tags:
      - companies
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
          description: ''
  /api/history/:
    get:
      operationId: history_list
      parameters:
      - in: query
        name: type
        schema:
          type: string
      tags:
      - history
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
  /api/inquiries/:
    post:
      operationId: inquiries_create
      summary: Store a fictional 'Request this plan' submission
      tags:
      - inquiries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inquiry'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryConfirmation'
          description: ''
  /api/meta/:
    get:
      operationId: meta_retrieve
      summary: Site date, stardate, subspace speed and sources
      tags:
      - meta
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/network/:
    get:
      operationId: network_retrieve
      summary: Nodes, links and orbit data for the maps
      parameters:
      - in: query
        name: company
        schema:
          type: string
      - in: query
        name: layer
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      tags:
      - network
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
          description: ''
  /api/quotes/:
    get:
      operationId: quotes_retrieve
      summary: Route summary and priced offers for a pair of worlds
      parameters:
      - in: query
        name: class
        schema:
          type: array
          items:
            type: string
      - in: query
        name: company
        schema:
          type: array
          items:
            type: string
      - in: query
        name: env
        schema:
          type: array
          items:
            type: string
      - in: query
        name: from
        schema:
          type: string
        required: true
      - in: query
        name: kind
        schema:
          type: array
          items:
            type: string
      - in: query
        name: maxLatencyMs
        schema:
          type: number
          format: double
      - in: query
        name: reroute
        schema:
          type: boolean
      - in: query
        name: sector
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - latency
          - price
          - tier
          - worst-latency
      - in: query
        name: tier
        schema:
          type: array
          items:
            type: string
      - in: query
        name: to
        schema:
          type: string
        required: true
      tags:
      - quotes
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
          description: ''
  /api/regions/:
    get:
      operationId: regions_list
      tags:
      - regions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/simulation/:
    get:
      operationId: simulation_retrieve
      summary: Monte Carlo run details and market statistics
      tags:
      - simulation
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
          description: ''
  /api/simulation/worlds/:
    get:
      operationId: simulation_worlds_list
      summary: Per-world medians and percentiles across the Monte Carlo runs
      parameters:
      - in: query
        name: metric
        schema:
          type: string
          enum:
          - colonized
          - constellation
          - one-million
          - population
          - subspace
      - in: query
        name: samples
        schema:
          type: boolean
      - in: query
        name: world
        schema:
          type: string
      tags:
      - simulation
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorldStatistic'
          description: ''
  /api/worlds/:
    get:
      operationId: worlds_list
      tags:
      - worlds
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorldList'
          description: ''
  /api/worlds/{world_id}/:
    get:
      operationId: worlds_retrieve
      parameters:
      - in: path
        name: worldId
        schema:
          type: string
        required: true
      tags:
      - worlds
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldDetail'
          description: ''
components:
  schemas:
    Addon:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        companyId:
          type: string
          nullable: true
        monthly:
          type: integer
      required:
      - companyId
      - id
      - label
      - monthly
    BlankEnum:
      enum:
      - ''
    BreakdownLine:
      type: object
      properties:
        label:
          type: string
        credits:
          type: integer
      required:
      - credits
      - label
    CanonFact:
      type: object
      properties:
        id:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        topic:
          type: string
          readOnly: true
        world:
          type: string
          nullable: true
        statement:
          type: string
          readOnly: true
        episodes:
          type: array
          items:
            type: string
            maxLength: 120
          readOnly: true
        howUsed:
          type: string
          readOnly: true
          description: How the simulation uses it, or why it was left out.
        standing:
          allOf:
          - $ref: '#/components/schemas/StandingEnum'
          readOnly: true
        source:
          $ref: '#/components/schemas/Source'
        deadline:
          allOf:
          - $ref: '#/components/schemas/Deadline'
          nullable: true
          readOnly: true
      required:
      - category
      - deadline
      - episodes
      - howUsed
      - id
      - source
      - standing
      - statement
      - topic
      - world
    CanonNote:
      type: object
      properties:
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        text:
          type: string
        source:
          type: string
          nullable: true
      required:
      - source
      - text
    CategoryEnum:
      enum:
      - starting-condition
      - deadline
      - set-aside
      type: string
      description: |-
        * `starting-condition` - Starting Condition
        * `deadline` - Deadline
        * `set-aside` - Set Aside
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/CompanyKindEnum'
        sectors:
          type: array
          items:
            type: string
            maxLength: 20
        environment:
          type: string
          nullable: true
          readOnly: true
        focus:
          type: string
          maxLength: 300
        headquarters:
          type: string
        region:
          type: string
        founded:
          type: integer
          maximum: 32767
          minimum: 0
        parent:
          type: string
          nullable: true
        origin:
          type: string
          maxLength: 40
        status:
          $ref: '#/components/schemas/StatusEnum'
        owner:
          type: string
          nullable: true
        acquiredBy:
          type: string
          nullable: true
        acquiredYear:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        worldIds:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - acquiredBy
      - environment
      - focus
      - founded
      - headquarters
      - id
      - kind
      - name
      - origin
      - owner
      - parent
      - region
      - sectors
      - status
      - worldIds
    CompanyKindEnum:
      enum:
      - backbone
      - regional
      - gateway
      - specialist
      type: string
      description: |-
        * `backbone` - Backbone
        * `regional` - Regional
        * `gateway` - Gateway
        * `specialist` - Specialist
    Conjunction:
      type: object
      properties:
        activeNow:
          type: boolean
        nextStart:
          type: string
          format: date
          nullable: true
        nextEnd:
          type: string
          format: date
          nullable: true
      required:
      - activeNow
      - nextEnd
      - nextStart
    ConjunctionEnum:
      enum:
      - rerouted
      - degraded
      type: string
      description: |-
        * `rerouted` - rerouted
        * `degraded` - degraded
    ConstellationStartedAsEnum:
      enum:
      - conventional
      - subspace
      type: string
      description: |-
        * `conventional` - Conventional
        * `subspace` - Subspace
    Deadline:
      type: object
      properties:
        event:
          type: string
        year:
          type: integer
        threshold:
          type: number
          format: double
          nullable: true
        shareMet:
          type: number
          format: double
          nullable: true
          description: Share of runs that met it, 0 to 1.
        medianResult:
          type: number
          format: double
          nullable: true
          description: Median year (or population) simulated.
      required:
      - event
      - medianResult
      - shareMet
      - threshold
      - year
    DirectLatency:
      type: object
      properties:
        direct:
          type: number
          format: double
        min:
          type: number
          format: double
        max:
          type: number
          format: double
      required:
      - direct
      - max
      - min
    Event:
      type: object
      properties:
        year:
          type: integer
          maximum: 32767
          minimum: -32768
        type:
          type: string
          maxLength: 40
        world:
          type: string
        company:
          type: string
          nullable: true
        buyer:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
          readOnly: true
      required:
      - buyer
      - company
      - detail
      - type
      - world
      - year
    Inquiry:
      type: object
      properties:
        offerId:
          type: string
          maxLength: 40
        companyName:
          type: string
          maxLength: 120
        contact:
          type: string
          format: email
          maxLength: 254
        expectedTraffic:
          type: string
          maxLength: 500
        from:
          type: string
        to:
          type: string
      required:
      - companyName
      - contact
      - from
      - offerId
      - to
    InquiryConfirmation:
      type: object
      properties:
        demo:
          type: boolean
        message:
          type: string
      required:
      - demo
      - message
    Latency:
      type: object
      properties:
        now:
          type: number
          format: double
        min:
          type: number
          format: double
        max:
          type: number
          format: double
      required:
      - max
      - min
      - now
    Link:
      type: object
      properties:
        id:
          type: string
        layer:
          type: string
        a:
          type: string
        b:
          type: string
        operator:
          type: string
        established:
          type: integer
        processingMs:
          type: number
          format: double
        hardened:
          type: boolean
        capacityClass:
          type: string
        degraded:
          type: boolean
          description: Passes within 0.1 AU of the Sun at the site date.
      required:
      - a
      - b
      - capacityClass
      - degraded
      - established
      - hardened
      - id
      - layer
      - operator
      - processingMs
    Market:
      type: object
      properties:
        metric:
          type: string
        kind:
          type: string
        median:
          type: number
          format: double
          nullable: true
        p10:
          type: number
          format: double
          nullable: true
        p90:
          type: number
          format: double
          nullable: true
      required:
      - kind
      - median
      - metric
      - p10
      - p90
    Meta:
      type: object
      properties:
        title:
          type: string
        siteDate:
          type: string
          format: date
        stardate:
          type: string
        year:
          type: integer
        subspaceSpeedC:
          type: number
          format: double
          description: Subspace speed as a multiple of light speed.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
      required:
      - siteDate
      - sources
      - stardate
      - subspaceSpeedC
      - title
      - year
    Network:
      type: object
      properties:
        siteDate:
          type: string
        stardate:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        orbits:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Orbit'
      required:
      - links
      - nodes
      - orbits
      - siteDate
      - stardate
    Node:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        world:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        fixedPosition:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: AU; conjunction relays only.
      required:
      - fixedPosition
      - id
      - kind
      - region
      - world
    Offer:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          $ref: '#/components/schemas/OfferKindEnum'
        leadCompanyId:
          type: string
        ownerId:
          type: string
          nullable: true
        partnerIds:
          type: array
          items:
            type: string
        planIds:
          type: array
          items:
            type: string
        serviceClass:
          $ref: '#/components/schemas/ServiceClassEnum'
        throughput:
          type: integer
        resilienceTier:
          $ref: '#/components/schemas/ResilienceTierEnum'
        conjunction:
          $ref: '#/components/schemas/ConjunctionEnum'
        environments:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        hops:
          type: integer
        handoffs:
          type: integer
        onNetworkShare:
          type: number
          format: double
        latencyMs:
          $ref: '#/components/schemas/Latency'
        price:
          $ref: '#/components/schemas/Price'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/Addon'
        badges:
          type: array
          items:
            type: string
      required:
      - addons
      - badges
      - conjunction
      - environments
      - handoffs
      - hops
      - id
      - kind
      - latencyMs
      - leadCompanyId
      - onNetworkShare
      - ownerId
      - partnerIds
      - planIds
      - price
      - resilienceTier
      - sectors
      - segments
      - serviceClass
      - throughput
      - title
    OfferKindEnum:
      enum:
      - end-to-end
      - package
      type: string
      description: |-
        * `end-to-end` - end-to-end
        * `package` - package
    Orbit:
      type: object
      description: A Sun-orbiting world has Keplerian elements; a moon has a circular
        orbit.
      properties:
        kind:
          $ref: '#/components/schemas/OrbitKindEnum'
        semiMajorAxisAu:
          type: number
          format: double
        semiMajorAxisRate:
          type: number
          format: double
        eccentricity:
          type: number
          format: double
        eccentricityRate:
          type: number
          format: double
        longitudeOfPerihelionDeg:
          type: number
          format: double
        longitudeOfPerihelionRate:
          type: number
          format: double
        meanLongitudeDeg:
          type: number
          format: double
        meanLongitudeRate:
          type: number
          format: double
        b:
          type: number
          format: double
          nullable: true
        c:
          type: number
          format: double
          nullable: true
        s:
          type: number
          format: double
          nullable: true
        f:
          type: number
          format: double
          nullable: true
        parent:
          type: string
        orbitRadiusKm:
          type: number
          format: double
        periodDays:
          type: number
          format: double
        phaseDeg:
          type: number
          format: double
      required:
      - kind
    OrbitKindEnum:
      enum:
      - heliocentric
      - moon
      type: string
      description: |-
        * `heliocentric` - heliocentric
        * `moon` - moon
    Price:
      type: object
      properties:
        monthly:
          type: integer
        setup:
          type: integer
        currency:
          type: string
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/BreakdownLine'
        terms:
          type: object
          additionalProperties:
            type: integer
      required:
      - breakdown
      - currency
      - monthly
      - setup
      - terms
    QuoteResponse:
      type: object
      properties:
        route:
          $ref: '#/components/schemas/RouteSummary'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
      required:
      - offers
      - route
    Region:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        order:
          type: integer
          maximum: 32767
          minimum: 0
        worldIds:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - id
      - name
      - order
      - worldIds
    ResilienceTierEnum:
      enum:
      - standard
      - diverse-path
      - hardened
      - contingency
      - terraforming-zone
      type: string
      description: |-
        * `standard` - standard
        * `diverse-path` - diverse-path
        * `hardened` - hardened
        * `contingency` - contingency
        * `terraforming-zone` - terraforming-zone
    RouteSummary:
      type: object
      properties:
        date:
          type: string
          format: date
        stardate:
          type: string
        distanceKm:
          type: integer
        latencyMs:
          $ref: '#/components/schemas/DirectLatency'
        regions:
          type: array
          items:
            type: string
        providers:
          type: integer
        independentCarriers:
          type: integer
        conjunction:
          $ref: '#/components/schemas/Conjunction'
        from:
          type: string
        to:
          type: string
      required:
      - conjunction
      - date
      - distanceKm
      - from
      - independentCarriers
      - latencyMs
      - providers
      - regions
      - stardate
      - to
    Run:
      type: object
      properties:
        firstSeed:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        runCount:
          type: integer
          maximum: 2147483647
          minimum: 0
        startYear:
          type: integer
          maximum: 32767
          minimum: 0
        endYear:
          type: integer
          maximum: 32767
          minimum: 0
        scriptCommit:
          type: string
          description: Git commit of tools/colonization-sim.js.
          maxLength: 60
        generatedAt:
          type: string
          format: date-time
        canonicalSeed:
          type: integer
      required:
      - canonicalSeed
      - endYear
      - firstSeed
      - generatedAt
      - runCount
      - scriptCommit
      - startYear
    Segment:
      type: object
      properties:
        companyId:
          type: string
        layer:
          type: string
        nodeIds:
          type: array
          items:
            type: string
        linkIds:
          type: array
          items:
            type: string
        lengthKm:
          type: integer
        latencyMs:
          type: number
          format: double
      required:
      - companyId
      - latencyMs
      - layer
      - lengthKm
      - linkIds
      - nodeIds
    ServiceClassEnum:
      enum:
      - shared
      - dedicated
      - synchronized
      type: string
      description: |-
        * `shared` - shared
        * `dedicated` - dedicated
        * `synchronized` - synchronized
    Simulation:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/Run'
        market:
          type: array
          items:
            $ref: '#/components/schemas/Market'
      required:
      - market
      - run
    Source:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 500
      required:
      - id
      - title
      - url
    StandingEnum:
      enum:
      - on-screen
      - reference-book
      - not-found
      type: string
      description: |-
        * `on-screen` - On Screen
        * `reference-book` - Reference Book
        * `not-found` - Not Found
    StatusEnum:
      enum:
      - active
      - division
      - merged
      type: string
      description: |-
        * `active` - Active
        * `division` - Division
        * `merged` - Merged
    TypeEnum:
      enum:
      - planet
      - dwarf-planet
      - moon
      type: string
      description: |-
        * `planet` - Planet
        * `dwarf-planet` - Dwarf Planet
        * `moon` - Moon
    WorldDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: string
          nullable: true
        region:
          type: string
        eligible:
          type: boolean
          readOnly: true
          description: True when the world has a subspace constellation by the site
            date.
        radiusKm:
          type: number
          format: double
        gaseous:
          type: boolean
        massKg:
          type: number
          format: double
        surfaceGravity:
          type: number
          format: double
        mainElements:
          type: array
          items:
            type: string
            maxLength: 3
        distanceFromSunAu:
          type: number
          format: double
        orbitRadiusKm:
          type: number
          format: double
          nullable: true
        orbitalPeriodDays:
          type: number
          format: double
        orbitalSpeedKmS:
          type: number
          format: double
        constellationEstablished:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        constellationStartedAs:
          oneOf:
          - $ref: '#/components/schemas/ConstellationStartedAsEnum'
          - $ref: '#/components/schemas/BlankEnum'
        subspaceSince:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        colonized:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        homeworld:
          type: boolean
        passedOneMillion:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        population:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        populationHistory:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        subspaceLatencyToEarthMs:
          type: object
          additionalProperties:
            type: number
            format: double
          readOnly: true
          description: One-way subspace delay to Earth, closest and farthest approach.
        solarConjunctionWithEarthEveryDays:
          type: integer
          nullable: true
        canonNotes:
          type: array
          items:
            $ref: '#/components/schemas/CanonNote'
      required:
      - canonNotes
      - distanceFromSunAu
      - eligible
      - gaseous
      - id
      - mainElements
      - massKg
      - name
      - orbitalPeriodDays
      - orbitalSpeedKmS
      - parent
      - populationHistory
      - radiusKm
      - region
      - solarConjunctionWithEarthEveryDays
      - subspaceLatencyToEarthMs
      - surfaceGravity
      - type
    WorldList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: string
          nullable: true
        region:
          type: string
        eligible:
          type: boolean
          readOnly: true
          description: True when the world has a subspace constellation by the site
            date.
        radiusKm:
          type: number
          format: double
      required:
      - eligible
      - id
      - name
      - parent
      - radiusKm
      - region
      - type
    WorldStatistic:
      type: object
      properties:
        world:
          type: string
        metric:
          type: string
        median:
          type: number
          format: double
          nullable: true
        p10:
          type: number
          format: double
          nullable: true
        p90:
          type: number
          format: double
          nullable: true
        shareOfRuns:
          type: number
          format: double
        canonical:
          type: number
          format: double
          nullable: true
          description: The same measure in the canonical run (seed 1701) the shop
            uses.
        samples:
          type: array
          items:
            type: integer
          description: One value per run, ascending. Only when one world is named
            and samples=true.
      required:
      - canonical
      - median
      - metric
      - p10
      - p90
      - shareOfRuns
      - world
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
