[project]
name = "planet2planet-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.28",
  "djangorestframework-camel-case>=1.4",
  "psycopg[binary]>=3.2",
  "gunicorn>=23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"apps/pricing/constants.py" = ["E501"]
"*/tests/*" = ["E501"]
