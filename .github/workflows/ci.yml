name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: First-page bundle stays within budget
        run: npm run size

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node --test tools/*.test.js

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: planet2planet
          POSTGRES_USER: planet2planet
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planet2planet" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Seed and check data integrity
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python manage.py migrate
          python manage.py load_dataset
          python manage.py load_orbital_elements
          python manage.py build_network
          python manage.py generate_plans
          python manage.py load_canon_facts
          python manage.py load_simulation
          python manage.py check_data
      - name: OpenAPI schema is up to date
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff openapi.yaml /tmp/openapi.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Start the API and database
        run: |
          cp .env.example .env
          docker compose up -d --wait
          make seed
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      # Pixel snapshots are per platform; only macOS baselines are committed, so CI skips them.
      - run: npx playwright test --grep-invert @visual
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
